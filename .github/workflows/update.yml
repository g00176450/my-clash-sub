name: Update Free Clash Subscription

on:
  schedule:
    - cron: "10 1,5,9,13,17,21 * * *"   # UTC，北京时间 +8，每 4 小时
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch subscription
        env:
          FREECLASH_COOKIE: ${{ secrets.FREECLASH_COOKIE }}
        run: python fetch.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "===== 工作目录文件清单 ====="
          ls -la
          if [ ! -f clash.yaml ]; then
            echo "::error::clash.yaml 未生成"
            exit 1
          fi
          git add clash.yaml
          if [ -f v2ray.txt ]; then
            git add v2ray.txt
          fi
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "auto: update $(date -u +%Y-%m-%d_%H:%M) UTC"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
